<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조준선의 밤 산책</title>
<style>
  :root { --paper:#F1E6D0; --ink:#2B2733; --orange:#F26A21; --red:#C8433A; --navy:#1F2C55; --moon:#F5D46A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wrap { width: min(100%, calc((100vh - 110px) * 16 / 9)); min-width: 280px; margin: 0 auto; padding: 12px 16px 16px; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: var(--paper); }
  #start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border: 0; background: none; cursor: pointer; font: inherit; }
  #start span { background: var(--orange); color: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 12px 22px; font-size: 18px; font-weight: 700; }
  #bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .ctl { min-width: 44px; height: 34px; border: 2px solid var(--paper); border-radius: 8px; background: none; color: var(--paper); font: inherit; font-weight: 700; cursor: pointer; }
  .ctl:focus-visible, #scrub:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
  #scrub { flex: 1; accent-color: var(--orange); min-width: 0; }
  #time { font-variant-numeric: tabular-nums; white-space: nowrap; }
  #phasebar { position: relative; display: flex; height: 10px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
  #phasebar i { display: block; height: 100%; }
  #head { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: var(--ink); box-shadow: 0 0 0 1px var(--paper); }
  #meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 6px; opacity: .92; }
  #legend b { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: -1px; }
  body.capture { background: var(--paper); }
  body.capture #wrap { width: 1920px; padding: 0; margin: 0; }
  body.capture #ui, body.capture #start { display: none; }
  body.capture canvas { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="1920" height="1080" aria-label="조준선 캐릭터가 사격장을 빠져나와 밤하늘로 날아가는 30초 애니메이션"></canvas>
    <button id="start" aria-label="소리와 함께 재생"><span>▶ 재생 (소리 켜짐)</span></button>
  </div>
  <div id="ui">
    <div id="bar">
      <button id="pp" class="ctl" aria-label="재생 또는 일시정지">▶</button>
      <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="재생 위치">
      <span id="time">0.00 / 30.00초</span>
      <button id="snd" class="ctl" aria-pressed="true" aria-label="소리 켜기/끄기">소리 켬</button>
    </div>
    <div id="phasebar"><span id="head"></span></div>
    <div id="meta">
      <span id="label">S1 잠든 조준선 · 대기</span>
      <span id="legend"><b style="background:var(--paper)"></b>대기<b style="background:var(--moon)"></b>준비<b style="background:var(--orange)"></b>본동작<b style="background:var(--red)"></b>여운</span>
    </div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   조준선의 밤 산책 — Canvas 2D + 순수 JS, 외부 파일 없음
   규칙: 화면은 render(ctx, t) 하나로만 정해진다. 같은 t → 같은 그림.
         랜덤은 전부 고정 시드(mulberry32 / 정수 해시). 색은 PAL 6색만.
   ===================================================================== */
const W = 1920, H = 1080, DUR = 30;
const PAL = Object.freeze({
  paper: '#F1E6D0', ink: '#2B2733', orange: '#F26A21',
  red: '#C8433A', navy: '#1F2C55', moon: '#F5D46A',
});
const { paper: PAPER, ink: INK, orange: ORANGE, red: RED, navy: NAVY, moon: MOON } = PAL;
const TAU = Math.PI * 2;

/* ---------- 수학 / 시드 랜덤 ---------- */
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sat = x => clamp(x, 0, 1);
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = u => u * u * (3 - 2 * u);
const smoother = u => u * u * u * (u * (u * 6 - 15) + 10);       // 양 끝 속도·가속도 0
const ramp = (t, t0, t1) => smoother(sat((t - t0) / (t1 - t0)));  // t0→t1 사이 0→1
const bump = (t, t0, t1) => { const s = Math.sin(Math.PI * sat((t - t0) / (t1 - t0))); return s * s; }; // 0→1→0

function hash3(a, b, c) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x9e3779b1) ^ 0x5bd1e995;
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function mulberry32(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 손그림 선의 '보일링': 캐릭터 선만 1/8초마다 3장의 떨림 패턴을 돌린다 (t로 결정).
// 배경은 셀 애니메이션의 배경 그림처럼 고정(BOIL=0) — 화면이 차분하고 영상 용량도 작다.
let BOIL = 0, CHAR_BOIL = 0;
function vnoise(x, seed) {
  const i = Math.floor(x), f = x - i;
  const a = hash3(i, seed, BOIL), b = hash3(i + 1, seed, BOIL);
  return (a + (b - a) * smooth(f)) * 2 - 1;
}

/* ---------- 키프레임 트랙 ----------
   [시간, 값, easing] — easing은 그 키로 들어오는 구간의 모양. 기본은 smootherstep(속도 0에서 출발·도착)
   그래서 단계(대기→준비→본동작→여운) 사이가 끊기지 않는다. */
const EASE = { io: smoother, lin: u => u, in: u => u * u * u, out: u => 1 - (1 - u) ** 3 };
function track(keys) {
  for (let i = 1; i < keys.length; i++) {
    if (!(keys[i][0] > keys[i - 1][0])) throw new Error('키프레임 시간이 증가하지 않음: ' + keys[i][0]);
  }
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const k = keys[i];
      if (t <= k[0]) {
        const p = keys[i - 1];
        return lerp(p[1], k[1], EASE[k[2] || 'io']((t - p[0]) / (k[0] - p[0])));
      }
    }
    return keys[keys.length - 1][1];
  };
}
// 가속-등속-감속이 매끄러운 이동 곡선 (걷기용). a = 가속 구간 비율
function trap(u, a) {
  if (u <= 0) return 0; if (u >= 1) return 1;
  const D = 1 - a;
  if (u < a) { const x = u / a; return (a * (x * x * x - x * x * x * x / 2)) / D; }
  if (u <= 1 - a) return (a / 2 + (u - a)) / D;
  const x = (1 - u) / a; return 1 - (a * (x * x * x - x * x * x * x / 2)) / D;
}
function trapV(u, a) {
  if (u <= 0 || u >= 1) return 0;
  const D = 1 - a;
  if (u < a) { const x = u / a; return (3 * x * x - 2 * x * x * x) / D; }
  if (u <= 1 - a) return 1 / D;
  const x = (1 - u) / a; return (3 * x * x - 2 * x * x * x) / D;
}

/* ---------- 무대 배치 (월드 좌표, 줌 1일 때 1px) ---------- */
const WIN = { x0: 1580, y0: 130, x1: 1880, y1: 450 };   // 창문 구멍

/* ---------- 이동 (발 위치) ---------- */

  { t0: 20.6, t1: 21.1, kind: 'hop',  x0: 1662, y0: 604, x1: 1730, y1: 452, h: 105, sfx: 'wood' },
];
const walkX = (m, t) => lerp(m.x0, m.x1, trap((t - m.t0) / (m.t1 - m.t0), 0.25));
function feetPos(t) {
  let x = 600, y = 542;
  for (const m of MOVES) {
    if (t < m.t0) break;
    const u = sat((t - m.t0) / (m.t1 - m.t0));
    if (m.kind === 'hop') { x = lerp(m.x0, m.x1, u); y = lerp(m.y0, m.y1, u) - 4 * m.h * u * (1 - u); }
    else { x = walkX(m, Math.min(t, m.t1)); y = m.y; }
  }
  return { x, y };
}
function walkInfo(t) {
  for (const m of MOVES) {
    if (m.kind !== 'walk' || t < m.t0 || t > m.t1) continue;
    const u = (t - m.t0) / (m.t1 - m.t0);
    const speed = trapV(u, 0.25) * Math.abs(m.x1 - m.x0) / (m.t1 - m.t0);
    const d = Math.abs(walkX(m, t) - m.x0);
    return { phase: (d / m.step) * Math.PI, amt: smooth(sat(speed / 90)), move: m };
  }
  return { phase: 0, amt: 0, move: null };
}

/* ---------- 캐릭터 키프레임 (단계 주석: 대기 / 준비 / 본동작 / 여운) ---------- */

  eyeR: track([[0, 0], [2.0, 0], [2.5, 1], [12.68, 1], [12.8, 1.35], [13.02, 1.3], [13.2, 0], [14.85, 0], [15.1, 0.55],

const BLINKS = [3.75, 6.2, 8.3, 10.7, 17.15, 19.05, 23.0, 23.85, 27.6];

/* ---------- 카메라 ---------- */
const camX = track([[0, 960], [1.2, 960], [2.6, 680], [4.6, 690], [6.4, 820], [9.0, 835], [12.5, 1150], [16.3, 1160],
  [17.6, 1400], [19.3, 1480], [21.1, 1580], [22.5, 1650]]);
const camY = track([[0, 540], [1.2, 540], [2.6, 520], [4.6, 525], [6.4, 640], [9.0, 640], [12.5, 650], [16.3, 650],
  [17.6, 600], [19.3, 520], [21.1, 440], [22.5, 385], [25.2, 380]]);
const camZ = track([[0, 1], [1.2, 1], [2.6, 1.75], [4.6, 1.8], [6.4, 1.3], [9.0, 1.3], [12.5, 1.22], [16.3, 1.22],
  [17.6, 1.12], [19.3, 1.15], [21.1, 1.2], [22.5, 1.3], [25.2, 1.32]]);
const ZOOM_T0 = 25.2, ZOOM_T1 = 26.6;
function camera(t) {
  let cx = camX(t), cy = camY(t), z = camZ(t);
  if (t > ZOOM_T0) {
    // 달리 줌: 창문 중심이 화면 중심으로 미끄러지며 창문이 화면을 덮을 때까지 확대
    const e = smoother(sat((t - ZOOM_T0) / (ZOOM_T1 - ZOOM_T0)));
    const z0 = camZ(ZOOM_T0), c0x = camX(ZOOM_T0), c0y = camY(ZOOM_T0);
    z = Math.exp(lerp(Math.log(z0), Math.log(ZMAX), e));
    const qx = (A.x - c0x) * z0 * (1 - e), qy = (A.y - c0y) * z0 * (1 - e);
    cx = A.x - qx / z; cy = A.y - qy / z;
  }
  const zs = 1 + (z - 1) * SKY_PAR;                      // 먼 하늘은 덜 확대된다(시차)
  const sx = A.x + (cx - A.x) * SKY_K;
  const sy = A.y + (cy - A.y) * SKY_K - 40 * ramp(t, ZOOM_T1, DUR); // 밤하늘에서 천천히 고개 들기
  return { cx, cy, z, sx, sy, zs, skyOnly: t >= ZOOM_T1 };
}
const toScreen = (cam, x, y) => [(x - cam.cx) * cam.z + W / 2, (y - cam.cy) * cam.z + H / 2];
const skyScreen = (cam, x, y) => [(x - cam.sx) * cam.zs + W / 2, (y - cam.sy) * cam.zs + H / 2];
function visRect(cx, cy, z, pad = 30) {
  return [cx - W / 2 / z - pad, cy - H / 2 / z - pad, cx + W / 2 / z + pad, cy + H / 2 / z + pad];
}

/* ---------- 소품 상태 ---------- */
function windVis(t) {   // 눈에 보이는 바람 세기 (커튼, 더듬이)
  return ramp(t, 21.85, 22.3) * (0.75 + 0.25 * Math.sin(t * 2.1)) * (1 - 0.3 * ramp(t, 22.6, 23.6))
    + 0.6 * bump(t, 25.0, 26.4);
}
function popAngle(t) {  // 팝업 과녁: π/2 = 바닥에 누움, 0 = 똑바로 섬
  const t0 = 12.5, t1 = 12.68;
  if (t < t0) return Math.PI / 2;
  if (t < t1) { const u = (t - t0) / (t1 - t0); return (Math.PI / 2) * (1 - u * u); }
  const s = t - t1; return -0.3 * Math.exp(-3.2 * s) * Math.sin(13 * s);
}
function t2Rock(t) {    // 점프 반동으로 흔들리는 2번 과녁
  if (t < 5.0) return 0;
  const s = t - 5.0; return 0.075 * Math.exp(-2.1 * s) * Math.sin(8.5 * s);
}
function panelAngle(t) { // 창문 여닫이 각도 (밀면 출렁이며 열리고, 발사 돌풍에 활짝)
  let a = 0;
  if (t > 21.85) { const s = t - 21.85; a = 1.2 * (1 - Math.exp(-6 * s) * Math.cos(9 * s)); }
  return a + (1.95 - 1.2) * ramp(t, 25.25, 25.8);
}
const plateDown = t => ramp(t, 12.38, 12.47);

/* ---------- 캐릭터 상태 = f(t) ---------- */
// 더듬이 스프링: 0초부터 고정 간격으로 적분 → 같은 t면 항상 같은 값 (여운/팔로스루)
function antennaBend(t) {
  const dt = 1 / 240, h = 1 / 120, w = 17, z = 0.32;
  let th = 0, v = 0;
  const n = Math.floor(Math.max(0, t - 3.0) / dt);
  for (let i = 0; i <= n; i++) {
    const tt = 3.0 + i * dt;
    const vx = (feetPos(tt + h).x - feetPos(tt - h).x) / (2 * h);
    const vy = (feetPos(tt + h).y - feetPos(tt - h).y) / (2 * h);
    const target = clamp(-vx * 0.0016 + vy * 0.0004, -0.9, 0.9) - 0.32 * windVis(tt) * (0.7 + 0.3 * Math.sin(tt * 9.3));
    const acc = -w * w * (th - target) - 2 * z * w * v;
    v += acc * dt; th += v * dt;
  }
  return th;
}
function skyPathPts() {
  return [[40, -40], [-10, -95], [-150, -130], [-125, -225], [0, -215], [55, -150]];
}
const SKY_PTS = skyPathPts();
function catmull(pts, s) {  // 균등 Catmull-Rom, s∈[0,1]
  const n = pts.length - 1, f = clamp(s, 0, 1) * n, i = Math.min(n - 1, Math.floor(f)), u = f - i;
  const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n, i + 2)];
  const c = (a, b, c2, d) => 0.5 * ((2 * b) + (-a + c2) * u + (2 * a - 5 * b + 4 * c2 - d) * u * u + (-a + 3 * b - 3 * c2 + d) * u * u * u);
  return [c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1])];
}
const FLY_T0 = 25.35, FLY_T1 = 28.8;
function skyPath(t) {   // 하늘 좌표(창문 중심 기준)에서 링 중심 위치와 크기
  const u = sat((t - FLY_T0) / (FLY_T1 - FLY_T0));
  const s = 1 - Math.pow(1 - u, 2.4);
  const p = catmull(SKY_PTS, s);
  const hover = 3 * Math.sin(t * 2.2) * ramp(t, 28.8, 29.5);
  return { x: A.x + p[0], y: A.y + p[1] + hover, scale: 0.42 * (1 + 0.6 * (1 - s)) };
}

function charState(t) {
  const wk = walkInfo(t);
  const breath = 0.018 * Math.sin(TAU * 0.45 * t) * (1 - ramp(t, 2.8, 3.4));
  const sy = K.sy(t) * (1 + breath);
  const trem = ramp(t, 13.45, 13.7) * (1 - ramp(t, 14.55, 14.85));
  const sway = 0.045 * Math.sin(t * 2.3) * ramp(t, 22.0, 22.6) * (1 - ramp(t, 23.8, 24.3));
  let blink = 1;
  for (const b of BLINKS) blink *= 1 - bump(t, b, b + 0.17);
  const swing = Math.sin(wk.phase) * wk.amt;
  return {
    sy, sx: 1 + (1 - sy) * 0.55,
    cf: K.cf(t),
    lean: K.lean(t) + 0.035 * swing + sway,
    armL: K.armL(t) + 0.16 * swing, armR: K.armR(t) - 0.16 * swing,
    walkPhase: wk.phase, walkAmt: wk.amt,
    bobY: -4 * Math.abs(Math.sin(wk.phase)) * wk.amt,
    tremX: 1.4 * Math.sin(t * 61) * trem,
    eyeL: K.eyeL(t) * blink, eyeR: K.eyeR(t) * blink, happy: K.happy(t),
    px: K.px(t), py: K.py(t), browUp: K.browUp(t), browTilt: K.browTilt(t),
    smile: K.smile(t), mouthOpen: K.mouthOpen(t), sweat: K.sweat(t),
    antenna: antennaBend(t),
    spin: 10 * Math.PI * smoother(sat((t - 24.6) / 4.2)),
    sparkle: ramp(t, 28.5, 29.0),
  };
}
// 캐릭터의 화면 위치(발), 크기, 벽 뒤로 넘어갔는지
const CROSS_T = 25.62;
function charScreen(t, cam, st) {
  const f = feetPos(t);
  let fx = f.x + st.tremX, fy = f.y + st.bobY, ws = CS;
  if (t > ZOOM_T0) {
    const u = sat((t - ZOOM_T0) / 0.7);
    fy = 452 - 230 * (1 - (1 - u) ** 3);
    ws = CS * (1 - 0.5 * smoother(u));
  }
  let [x, y] = toScreen(cam, fx, fy), s = ws * cam.z;
  const w = smoother(sat((t - FLY_T0) / 0.75));
  if (w > 0) {
    const p = skyPath(t), ss = p.scale * cam.zs;
    const [qx, qy] = skyScreen(cam, p.x, p.y);
    x = lerp(x, qx, w); y = lerp(y, qy + 62 * ss * st.sy, w); s = lerp(s, ss, w);
  }
  return { x, y, s, behind: t >= CROSS_T, w };
}

/* ---------- 손그림 도구 ---------- */
function wob(pts, amp, seed, closed, step) {
  const out = [], n = pts.length, segs = closed ? n : n - 1;
  let dist = 0;
  for (let i = 0; i < segs; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1e-6;
    const nx = -dy / L, ny = dx / L, k = Math.max(1, Math.ceil(L / step));
    for (let j = 0; j < k; j++) {
      const u = j / k, o = amp * vnoise((dist + u * L) * 0.045, seed);
      out.push([a[0] + dx * u + nx * o, a[1] + dy * u + ny * o]);
    }
    dist += L;
  }
  if (!closed) {
    const a = pts[n - 2] || pts[0], b = pts[n - 1];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1e-6, o = amp * vnoise(dist * 0.045, seed);
    out.push([b[0] - (dy / L) * o, b[1] + (dx / L) * o]);
  }
  return out;
}
function trace(ctx, p, closed) {
  ctx.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
  if (closed) ctx.closePath();
}
// 선 긋기. double=true면 연필로 한 번 더 그은 듯 얇은 선을 겹친다
function sk(ctx, pts, color, w, o = {}) {
  const amp = o.amp ?? 1.3, seed = o.seed ?? 1, closed = !!o.closed, step = o.step || 10;
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); trace(ctx, wob(pts, amp, seed, closed, step), closed); ctx.stroke();
  if (o.double) {
    ctx.lineWidth = w * 0.42;
    ctx.beginPath(); trace(ctx, wob(pts, amp * 1.9, seed + 101, closed, step), closed); ctx.stroke();
  }
}
function fillPts(ctx, pts, color, dx = 0, dy = 0, amp = 0.8, seed = 9) {
  const p = wob(pts, amp, seed, true, 14);
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(p[0][0] + dx, p[0][1] + dy);
  for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + dx, p[i][1] + dy);
  ctx.closePath(); ctx.fill();
}
function ellPts(cx, cy, rx, ry, seed, over = 0) {  // over>0: 끝이 살짝 겹치는 손그림 원
  const n = Math.max(16, Math.round(Math.max(rx, ry) * 0.55));
  const a0 = hash3(seed, 3, 5) * TAU, out = [], m = Math.round(n * (1 + over));
  for (let i = 0; i <= m; i++) {
    const a = a0 + (i / n) * TAU, r = over ? 1 + 0.03 * (i / m - 0.5) : 1;
    out.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]);
  }
  if (!over) out.pop();
  return out;
}
const polyPath = (c, pts) => { c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); };
function disc(ctx, x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); }

// 해칭: 선 위치는 월드에 고정(카메라가 움직여도 선이 미끄러지지 않음), 보이는 범위만 그린다
function hatch(ctx, clip, rect, ang, gap, color, w, seed, amp = 1.2, breaks = 0.06) {
  ctx.save(); ctx.beginPath(); clip(ctx); ctx.clip('evenodd');
  const ca = Math.cos(ang), sa = Math.sin(ang), nx = -sa, ny = ca;
  let dmin = Infinity, dmax = -Infinity, smin = Infinity, smax = -Infinity;
  for (const [x, y] of [[rect[0], rect[1]], [rect[2], rect[1]], [rect[0], rect[3]], [rect[2], rect[3]]]) {
    const d = x * nx + y * ny, s = x * ca + y * sa;
    dmin = Math.min(dmin, d); dmax = Math.max(dmax, d); smin = Math.min(smin, s); smax = Math.max(smax, s);
  }
  const step = 34, s0 = Math.floor(smin / step) * step;
  ctx.beginPath();
  for (let k = Math.floor(dmin / gap) - 1; k <= Math.ceil(dmax / gap) + 1; k++) {
    const d = (k + (hash3(k, seed, 7) - 0.5) * 0.35) * gap;
    let pen = false;
    for (let s = s0, j = Math.floor(s0 / step); s <= smax + step; s += step, j++) {
      if (hash3(k, j, seed) < breaks) { pen = false; continue; }
      const o = amp * vnoise(s * 0.02, seed * 977 + k);
      const x = nx * (d + o) + ca * s, y = ny * (d + o) + sa * s;
      if (pen) ctx.lineTo(x, y); else { ctx.moveTo(x, y); pen = true; }
    }
  }
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
}

/* ---------- 하늘 (창밖 + 마지막 장면) ---------- */
const SKY = (() => {
  const rnd = mulberry32(20261010), stars = [];
  const moon = { x: A.x + 150, y: A.y - 160, r: 42 };
  while (stars.length < 110) {
    const x = A.x + (rnd() * 2 - 1) * 720, y = A.y - 430 + rnd() * 560;
    const big = rnd() < 0.14;
    const s = { x, y, r: big ? 3 + rnd() * 1.4 : 1.7 + rnd() * 1.4, big, rate: 1.4 + rnd() * 2.6, ph: rnd() * TAU };
    if (Math.hypot(x - moon.x, y - moon.y) < 80) continue;
    stars.push(s);
  }
  const roofs = []; let x = A.x - 820;
  while (x < A.x + 820) {
    const w = 70 + rnd() * 90, top = A.y + 135 + rnd() * 60;
    roofs.push({ x, w, top, peak: rnd() < 0.35, chim: rnd() < 0.4, win: Math.floor(rnd() * 1e9) });
    x += w - 4;
  }
  const puffs = [[-48, 2, 20], [-18, -14, 28], [16, -8, 24], [44, 2, 18]];
  const clouds = [{ x: A.x - 470, y: A.y - 240, s: 1.25, puffs }, { x: A.x + 380, y: A.y - 20, s: 1.0, puffs }];
  return { stars, moon, roofs, clouds };
})();

function drawSky(ctx, t, cam, clipRect) {
  ctx.save();
  if (clipRect) { ctx.beginPath(); ctx.rect(clipRect[0], clipRect[1], clipRect[2] - clipRect[0], clipRect[3] - clipRect[1]); ctx.clip(); }
  ctx.fillStyle = NAVY; ctx.fillRect(0, 0, W, H);
  const zs = cam.zs, sz = Math.sqrt(zs);
  // 별
  for (const s of SKY.stars) {
    const [x, y] = skyScreen(cam, s.x, s.y);
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
    const r = s.r * sz * (0.72 + 0.28 * Math.sin(t * s.rate + s.ph));
    if (s.big) {
      ctx.fillStyle = MOON; ctx.beginPath();
      for (let i = 0; i < 8; i++) { const a = (i * Math.PI) / 4, rr = i % 2 ? r * 0.55 : r * 2.4; const p = [x + Math.cos(a - Math.PI / 2) * rr, y + Math.sin(a - Math.PI / 2) * rr]; i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
      ctx.closePath(); ctx.fill();
    } else disc(ctx, x, y, r, MOON);
  }
  // 구름: 원 몇 개를 합친 몽글몽글한 모양, 윗부분에만 달빛 테두리
  for (const [i, c] of SKY.clouds.entries()) {
    const cx = c.x + 5 * t, circ = c.puffs.map(([dx, dy, r]) => [...skyScreen(cam, cx + dx * c.s, c.y + dy * c.s), r * c.s * zs]);
    for (const [j, [x, y, r]] of circ.entries()) fillPts(ctx, ellPts(x, y, r + 2.4, r + 2.4, 600 + i * 9 + j), MOON, 0, 0, 0.8, 610 + j);
    for (const [j, [x, y, r]] of circ.entries()) fillPts(ctx, ellPts(x, y, r, r, 600 + i * 9 + j), INK, 0, 0, 0.8, 610 + j);
    const [bx0, by] = skyScreen(cam, cx - 62 * c.s, c.y), [bx1] = skyScreen(cam, cx + 62 * c.s, c.y);
    ctx.fillStyle = INK; ctx.fillRect(bx0, by - 1, bx1 - bx0, 15 * c.s * zs);
  }
  // 달
  const m = SKY.moon, [mx, my] = skyScreen(cam, m.x, m.y), mr = m.r * zs;
  sk(ctx, ellPts(mx, my, mr * 1.45, mr * 1.45, 71, 0.08), MOON, 1.6, { seed: 72, amp: 1.2 });
  disc(ctx, mx + 2, my + 2, mr, MOON);
  sk(ctx, ellPts(mx, my, mr, mr, 73, 0.1), INK, 2.6, { seed: 74, amp: 1, double: true });
  for (const [dx, dy, r] of [[-0.32, -0.18, 0.2], [0.28, 0.25, 0.14], [0.05, 0.42, 0.09], [0.36, -0.32, 0.08]]) {
    sk(ctx, ellPts(mx + dx * mr, my + dy * mr, r * mr, r * mr * 0.85, 80 + r * 100, 0.1), INK, 1.4, { seed: 81, amp: 0.6 });
  }
  // 지붕들
  for (const [i, r] of SKY.roofs.entries()) {
    const pts = [[r.x, A.y + 520], [r.x, r.top]];
    if (r.peak) pts.push([r.x + r.w / 2, r.top - 34]);
    if (r.chim) pts.push([r.x + r.w * 0.7, r.top - (r.peak ? 12 : 0)], [r.x + r.w * 0.7, r.top - 30], [r.x + r.w * 0.82, r.top - 30], [r.x + r.w * 0.82, r.top - (r.peak ? 6 : 0)]);
    pts.push([r.x + r.w, r.top], [r.x + r.w, A.y + 520]);
    const sp = pts.map(p => skyScreen(cam, p[0], p[1]));
    fillPts(ctx, sp, INK, 0, 0, 1.6, 700 + i);
    sk(ctx, sp.slice(1, -1), MOON, 1.6, { seed: 720 + i, amp: 1.4 });
    const rnd = mulberry32(r.win);
    for (let wy = r.top + 16; wy < r.top + 140; wy += 26) {
      for (let wx = r.x + 12; wx < r.x + r.w - 20; wx += 24) {
        if (rnd() < 0.3) {
          const [a, b] = skyScreen(cam, wx, wy);
          ctx.fillStyle = MOON; ctx.fillRect(a, b, 9 * zs, 11 * zs);
        }
      }
    }
  }
  ctx.restore();
}

/* ---------- 방 ---------- */
function drawLamp(ctx, x, t, seed) {
  const sway = 3 * Math.sin(t * 0.8 + seed);
  sk(ctx, [[x, -900], [x + sway, 30]], INK, 2.4, { seed: seed, step: 40 });
  const L = [[x + sway - 17, 30], [x + sway + 17, 30], [x + sway + 62, 92], [x + sway - 62, 92]];
  fillPts(ctx, L, INK, 3, 2, 0.8, seed + 1);
  sk(ctx, L, INK, 3, { closed: true, seed: seed + 2 });
  sk(ctx, [[x + sway - 34, 52], [x + sway - 50, 80]], PAPER, 2.2, { seed: seed + 3 });
  disc(ctx, x + sway, 100, 11, PAPER);
  sk(ctx, ellPts(x + sway, 100, 11, 11, seed + 4, 0.1), INK, 2, { seed: seed + 5, amp: 0.6 });
}
function drawClock(ctx, t) {
  const x = 1255, y = 255, r = 46;
  disc(ctx, x + 3, y + 3, r, PAPER);
  sk(ctx, ellPts(x, y, r, r, 31, 0.1), INK, 3.2, { seed: 32, double: true });
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * TAU, r0 = i % 3 ? r - 8 : r - 13;
    sk(ctx, [[x + Math.cos(a) * r0, y + Math.sin(a) * r0], [x + Math.cos(a) * (r - 4), y + Math.sin(a) * (r - 4)]], INK, 2, { seed: 33 + i, amp: 0.4 });
  }
  const sec = 15 + Math.floor(t) + smoother(sat((t - Math.floor(t)) / 0.12));
  const hand = (frac, len, w, c, sd) => { const a = frac * TAU - Math.PI / 2; sk(ctx, [[x, y], [x + Math.cos(a) * len, y + Math.sin(a) * len]], c, w, { seed: sd, amp: 0.4 }); };
  hand((11 + 59 / 60) / 12, r * 0.5, 4, INK, 41);
  hand((59 + sec / 60) / 60, r * 0.78, 3, INK, 42);
  hand(sec / 60, r * 0.85, 1.8, RED, 43);

function drawChar(ctx, st, X, Y, S) {

/* ---------- 한 프레임 = render(t) ---------- */
function render(ctx, t) {

  const cam = camera(t), st = charState(t); st.t = t;
  const cp = charScreen(t, cam, st);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (cam.skyOnly) {
    drawSky(ctx, t, cam, null);
    drawTrail(ctx, t, cam);
    drawChar(ctx, st, cp.x, cp.y, cp.s);
  } else {
    const [wx0, wy0] = toScreen(cam, WIN.x0, WIN.y0), [wx1, wy1] = toScreen(cam, WIN.x1, WIN.y1);
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
    drawSky(ctx, t, cam, [wx0 - 2, wy0 - 2, wx1 + 2, wy1 + 2]);
    const world = () => ctx.setTransform(cam.z, 0, 0, cam.z, W / 2 - cam.cx * cam.z, H / 2 - cam.cy * cam.z);

    if (cp.behind) { ctx.setTransform(1, 0, 0, 1, 0, 0); drawTrail(ctx, t, cam); drawChar(ctx, st, cp.x, cp.y, cp.s); }

/* ---------- 장면/단계 표 (UI 표시용) ---------- */
const PHASES = [
  [0, 2.0, 'S1 잠든 조준선', '대기'], [2.0, 5.0, 'S1 잠든 조준선', '준비'],
  [5.0, 5.7, 'S2 탈출 점프', '본동작'], [5.7, 6.3, 'S2 탈출 점프', '여운'], [6.3, 7.6, 'S2 탈출 점프', '대기'], [7.6, 9.0, 'S2 탈출 점프', '준비'],
  [9.0, 13.08, 'S3 살금살금', '본동작'], [13.08, 13.5, 'S3 살금살금', '준비'], [13.5, 14.8, 'S3 살금살금', '대기'],
  [14.8, 15.8, 'S3 살금살금', '여운'], [15.8, 16.3, 'S3 살금살금', '준비'], [16.3, 17.6, 'S3 살금살금', '본동작'],
  [17.6, 18.1, 'S4 창문까지', '대기'], [18.1, 18.4, 'S4 창문까지', '준비'], [18.4, 18.9, 'S4 창문까지', '본동작'], [18.9, 19.15, 'S4 창문까지', '여운'],
  [19.15, 19.3, 'S4 창문까지', '준비'], [19.3, 19.8, 'S4 창문까지', '본동작'], [19.8, 20.25, 'S4 창문까지', '여운'],
  [20.25, 20.6, 'S4 창문까지', '준비'], [20.6, 21.1, 'S4 창문까지', '본동작'], [21.1, 21.5, 'S4 창문까지', '여운'],
  [21.5, 21.85, 'S4 창문까지', '준비'], [21.85, 22.5, 'S4 창문까지', '본동작'],
  [22.5, 24.0, 'S5 도약', '대기'], [24.0, 25.2, 'S5 도약', '준비'], [25.2, 26.6, 'S5 도약', '본동작'],
  [26.6, 28.8, 'S6 밤하늘', '여운'], [28.8, 30.0, 'S6 밤하늘', '대기'],

const phaseAt = t => PHASES.find(p => t >= p[0] && t < p[1]) || PHASES[PHASES.length - 1];

/* =====================================================================
   소리 — Web Audio API로 전부 코드 생성. 소리도 타임라인 t에서 나온다.
   노이즈 버퍼는 고정 시드, 루프 위치 = t mod 4초 → 같은 t는 같은 소리.
   ===================================================================== */
const NOISE_SEC = 4;
function windLevel(t) {

const windFreq = t => 380 + 420 * ramp(t, 21.85, 22.35) + 1100 * bump(t, 25.1, 26.7) + 90 * Math.sin(t * 0.7);
const SFX_P = {
  tip:    { f: 2300, q: 1.3, g: 0.2,  d: 0.05, th: 0.07, thf: 190 },
  land:   { f: 850,  q: 1.0, g: 0.36, d: 0.13, th: 0.42, thf: 105 },
  wood:   { f: 480,  q: 6,   g: 0.5,  d: 0.15, th: 0.3,  thf: 150 },
  click:  { f: 4200, q: 2.5, g: 0.32, d: 0.022, th: 0,   thf: 0 },
  clack:  { f: 1250, q: 3.5, g: 0.6,  d: 0.17, th: 0.32, thf: 210 },
  rattle: { f: 1700, q: 5,   g: 0.2,  d: 0.05, th: 0,    thf: 0 },
};
function buildEvents() {
  const ev = [];
  for (const m of MOVES) {
    if (m.kind === 'walk') {
      let prev = null;
      for (let t = m.t0; t <= m.t1; t += 1 / 480) {
        const w = walkInfo(t), k = Math.floor(w.phase / Math.PI);
        if (prev !== null && k > prev && w.amt > 0.3) ev.push({ t, type: 'tip', v: 0.65 + 0.35 * w.amt * (k % 2 ? 0.85 : 1) });
        prev = k;
      }
    } else ev.push({ t: m.t1, type: m.sfx, v: m.t1 > 21 ? 0.75 : 1 });
  }
  ev.push({ t: 5.0, type: 'tip', v: 0.5 }, { t: 12.45, type: 'click', v: 1 }, { t: 12.68, type: 'clack', v: 1 },
    { t: 12.86, type: 'rattle', v: 0.7 }, { t: 13.12, type: 'rattle', v: 0.45 }, { t: 21.85, type: 'clack', v: 0.45 },
    { t: 25.2, type: 'land', v: 0.45 });
  const out = ev.filter(e => !(e.type === 'tip' && Math.abs(e.t - 12.45) < 0.12)).sort((a, b) => a.t - b.t);
  for (const e of out) {
    const cam = camera(e.t), st = charState(e.t);
    e.pan = clamp((charScreen(e.t, cam, st).x - W / 2) / (W / 2) * 0.7, -0.8, 0.8);

}
let EVENTS = null;
function makeNoise(ctx) {
  const len = Math.floor(ctx.sampleRate * NOISE_SEC), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  const rnd = mulberry32(4242);
  for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;

}
// t0(타임라인)부터의 소리를 ctx 시간 startAt에 맞춰 예약. 반환: 정지 함수
function buildAudio(ctx, out, t0, startAt) {

    gB.gain.linearRampToValueAtTime(windLevel(tt) * 0.9, T(tt));
    gL.gain.linearRampToValueAtTime(windLevel(tt) * 0.7, T(tt));

      og.gain.exponentialRampToValueAtTime(0.0001, at + 0.14);

  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true); dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * ch * 2, true); dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true); str(36, 'data');
  dv.setUint32(40, len * ch * 2, true);

/* =====================================================================
   플레이어 + 헤드리스 캡처용 훅
   ===================================================================== */
const cv = document.getElementById('c'), ctx2d = cv.getContext('2d');
const CAPTURE = new URLSearchParams(location.search).has('capture');
window.__render = t => { render(ctx2d, t); return true; };
window.__state = t => { const cam = camera(t), st = charState(t), cp = charScreen(t, cam, st); return { ...st, cam, cp }; };
window.__events = () => (EVENTS = EVENTS || buildEvents());
window.__renderAudio = async () => {
  const sr = 48000, octx = new OfflineAudioContext(2, sr * DUR, sr);
  buildAudio(octx, masterChain(octx), 0, 0);
  const bytes = encodeWav(await octx.startRendering());
  let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};

if (CAPTURE) {
  document.body.classList.add('capture');
  render(ctx2d, 0);
} else {
  const $ = id => document.getElementById(id);
  const pp = $('pp'), scrub = $('scrub'), time = $('time'), label = $('label'), snd = $('snd'), head = $('head'), bar = $('phasebar');
  const PCOL = { '대기': PAPER, '준비': MOON, '본동작': ORANGE, '여운': RED };
  for (const p of PHASES) {
    const i = document.createElement('i');
    i.style.width = ((p[1] - p[0]) / DUR * 100) + '%'; i.style.background = PCOL[p[3]];
    i.title = `${p[2]} · ${p[3]} (${p[0]}–${p[1]}초)`;
    bar.insertBefore(i, head);
  }
  let playing = false, curT = 0, t0 = 0, wall0 = 0, actx = null, master = null, stopAudio = null, audioStart = 0, soundOn = true, dirty = true;
  const clock = () => (actx && soundOn && stopAudio) ? t0 + (actx.currentTime - audioStart) : t0 + (performance.now() - wall0) / 1000;
  function startAudio() {
    if (!soundOn) return;
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = masterChain(actx); }
    if (actx.state === 'suspended') actx.resume();
    audioStart = actx.currentTime + 0.06;
    const bus = actx.createGain(); bus.connect(master);
    const stop = buildAudio(actx, bus, curT, audioStart);
    stopAudio = () => { stop(); bus.disconnect(); stopAudio = null; };
  }
  function play() {
    if (curT >= DUR - 0.01) curT = 0;
    playing = true; t0 = curT; wall0 = performance.now(); pp.textContent = '❚❚';
    startAudio();
  }
  function pause() { playing = false; if (stopAudio) stopAudio(); pp.textContent = '▶'; dirty = true; }
  function seek(t) { const was = playing; if (was) pause(); curT = clamp(t, 0, DUR); dirty = true; if (was) play(); }
  $('start').addEventListener('click', () => { $('start').remove(); play(); });
  pp.addEventListener('click', () => { const s = $('start'); if (s) s.remove(); playing ? pause() : play(); });
  scrub.addEventListener('input', () => { if (playing) pause(); curT = +scrub.value; dirty = true; });
  snd.addEventListener('click', () => {
    soundOn = !soundOn; snd.textContent = soundOn ? '소리 켬' : '소리 끔'; snd.setAttribute('aria-pressed', String(soundOn));
    if (playing) { const t = clock(); pause(); curT = t; play(); }
  });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.code !== 'Space') return;
    if (e.code === 'Space') { e.preventDefault(); pp.click(); }
    else if (e.code === 'ArrowRight') seek((playing ? clock() : curT) + 1);
    else if (e.code === 'ArrowLeft') seek((playing ? clock() : curT) - 1);
  });
  (function loop() {
    if (playing) { curT = clock(); if (curT >= DUR) { curT = DUR; pause(); } dirty = true; }
    if (dirty) {
      render(ctx2d, curT); dirty = false;
      scrub.value = curT.toFixed(2); time.textContent = `${curT.toFixed(2)} / 30.00초`;
      const p = phaseAt(curT); label.textContent = `${p[2]} · ${p[3]}`; head.style.left = (curT / DUR * 100) + '%';
    }
    requestAnimationFrame(loop);
  })();
}
